# 매일 새벽 실거래가 자동 수집
# - 매일: 최근 3개월을 다시 받음 (늦게 신고된 거래, 취소 거래 반영)
# - 수동 실행(Actions 탭 → Run workflow): 시작월/종료월을 넣으면 그 기간을 백필
name: 실거래가 수집

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18시 = 한국 새벽 3시
  workflow_dispatch:
    inputs:
      start:
        description: "시작월 (예: 201601) — 비우면 최근 3개월"
        required: false
      end:
        description: "종료월 (예: 202609)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            python collect_trades.py "${{ inputs.start }}" "${{ inputs.end || inputs.start }}"
          else
            python collect_trades.py --recent
          fi

      - name: 변경된 데이터 저장
        if: always()   # 수집이 중간에 실패해도 받은 달까지는 저장 (다시 돌리면 이어서 받음)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 수집 $(date -u +%Y-%m-%d)"
            git push
          fi
