# 매일 새벽 실거래(매매+전월세) 자동 수집
# - 매일: 최근 3개월을 다시 받음 (늦게 신고된 거래, 취소 거래 반영)
# - 수동 실행(Actions 탭 → Run workflow): 종류와 시작월/종료월을 넣으면 그 기간을 백필
name: 실거래가 수집

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18시 = 한국 새벽 3시
  workflow_dispatch:
    inputs:
      dataset:
        description: "종류"
        type: choice
        options: [all, trades, rent]
        default: all
      start:
        description: "시작월 (예: 201601) — 비우면 최근 3개월"
        required: false
      end:
        description: "종료월 (예: 202609)"
        required: false
      first_gu:
        description: "단지 정보를 먼저 채울 구 (예: 송파구,강동구)"
        required: false

permissions:
  contents: write
  actions: write     # 중간 저장 후 사이트 배포 워크플로 실행

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          DATASET="${{ inputs.dataset || 'all' }}"
          if [ -n "${{ inputs.start }}" ]; then
            python collect.py "$DATASET" "${{ inputs.start }}" "${{ inputs.end || inputs.start }}"
          else
            python collect.py "$DATASET" --recent
          fi

      - name: 청약·분양 정보 갱신
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: python collect_subscription.py || echo "⚠️ 청약 정보 수집 실패 — 다른 데이터는 계속 저장"

      - name: 단지 정보 갱신 (25분마다 저장 + 사이트 갱신)
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          FIRST_GU: ${{ inputs.first_gu }}
          MAX_MINUTES: "25"
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KAKAO_KEY" ]; then echo "KAKAO_KEY 비밀값 없음 — 건너뜀"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 최대 8회 × 25분. 회차마다 저장·푸시하고 사이트 배포를 요청 → 처리된 단지가 바로 화면에 보임
          for round in 1 2 3 4 5 6 7 8; do
            set +e; python build_complexes.py; code=$?; set -e
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "단지 정보 갱신 $(date -u +%Y-%m-%d) (${round}회차)"
              git pull --rebase && git push
              gh workflow run site.yml || true
            fi
            [ "$code" = "3" ] || break   # 3 = 남은 작업 있음, 그 외 = 완료(또는 오류)
          done

      - name: 변경된 데이터 저장
        if: always()   # 수집이 중간에 실패해도 받은 달까지는 저장 (다시 돌리면 이어서 받음)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 수집 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
