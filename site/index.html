<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="서울입지">
<title>서울 아파트 입지</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand-row"><div class="brand">서울 아파트 입지</div>
    <div><a href="#guide" class="auth-btn" style="text-decoration:none">📖 가이드</a> <button id="auth-btn" class="auth-btn">로그인</button></div></div>
  <input id="q" type="search" placeholder="단지명 · 동 · 지번 · '강남역'처럼 역 이름으로 주변 검색" autocomplete="off">
</header>

<main>
  <section id="tab-map" class="tab active">
    <div id="map"></div>
    <div class="map-ctl">
      <select id="m-color">
        <option value="r1">색: 1년 상승률</option>
        <option value="r3">색: 3년 상승률</option>
        <option value="jr">색: 전세가율</option>
        <option value="kp">색: 주변 대비 가격</option>
        <option value="df">색: 하락 방어력</option>
        <option value="ac">색: 출근 접근성</option>
      </select>
      <select id="m-label">
        <option value="p84">말풍선: 84㎡ 시세</option><option value="pp">말풍선: 평당가</option>
        <option value="r1">말풍선: 1년 상승률</option><option value="ls">말풍선: 입지점수</option><option value="name">말풍선: 단지명만</option>
      </select>
      <button class="chk" id="m-price">💰 가격 ON</button>
      <button class="chk" id="m-qbtn">🔎 필터</button>
      <button class="chk" id="m-more" aria-label="지도 설정">⚙️</button>
    </div>
    <div class="m-sugg" id="m-sugg" hidden></div>
    <div class="map-ctl map-panel" id="mq-panel" hidden>
      <div class="mp-head"><b>🔎 지도 필터</b><button class="mp-x" data-close-panel aria-label="닫기">✕</button></div>
      <label>보기 <select id="mq-view"><option value="">모든 단지</option><option value="both">⭐👥 관심단지만</option>
        <option value="fav">⭐ 내 관심만</option><option value="group">👥 그룹 관심만</option></select></label>
      <label>세대수 <select id="mq-hh"><option value="">전체</option><option value="300">300세대+</option>
        <option value="500">500세대+</option><option value="1000">1000세대+</option></select></label>
      <label>84㎡ 시세 <select id="mq-price"><option value="">전체</option><option value="0-10">10억 미만</option>
        <option value="10-15">10~15억</option><option value="15-20">15~20억</option><option value="20-30">20~30억</option><option value="30-0">30억 이상</option></select></label>
      <label>연식 <select id="mq-age"><option value="">전체</option><option value="new">10년 이내</option>
        <option value="mid">20년 이내</option><option value="old">30년 이상</option></select></label>
      <label>용적률 <select id="mq-far"><option value="">전체</option><option value="-200">200% 이하 (재건축 여력 큼)</option>
        <option value="-250">250% 이하</option><option value="250">250% 초과</option></select></label>
      <label>성격 <select id="mq-ty"><option value="">전체</option><option value="전천후형">⭐ 전천후형</option><option value="방어형">🛡️ 방어형</option>
        <option value="탄력형">🚀 탄력형</option><option value="평균형">⚖️ 평균형</option></select></label>
      <label>하락방어 <select id="mq-dg"><option value="">전체</option><option value="A">A만</option><option value="AB">B 이상</option></select></label>
      <label class="chk"><input type="checkbox" id="mq-recent"> 최근 1년 거래 있는 단지만</label>
      <label class="chk"><input type="checkbox" id="mq-small"> 소형·정보부족 단지도 보기</label>
      <div class="mp-btns"><button class="chip" id="mq-reset">초기화</button><button class="chip on" data-close-panel>적용하고 닫기</button></div>
    </div>
    <div class="map-ctl map-panel" id="m-panel" hidden>
      <div class="mp-head"><b>⚙️ 지도 설정</b><button class="mp-x" data-close-panel aria-label="닫기">✕</button></div>
      <label class="chk"><input type="checkbox" id="m-filter"> 순위 탭 필터를 지도에도 적용</label>
      <label class="chk"><input type="checkbox" id="m-favpin" checked> ⭐👥 관심단지 핀 표시</label>
      <label class="chk"><input type="checkbox" id="m-supply"> 청약·입주예정 표시</label>
      <label class="chk"><input type="checkbox" id="m-subway" checked> 지하철 노선·역</label>
      <label class="chk"><input type="checkbox" id="m-gu" checked> 구 경계</label>
      <select id="m-base"><option value="clean">배경지도: 깔끔</option><option value="color">배경지도: 컬러</option></select>
    </div>
    <div class="legend" id="legend"></div>
    <div class="peek" id="peek" hidden></div>
  </section>

  <section id="tab-list" class="tab">
    <div class="seg" id="list-seg">
      <button data-v="rank" class="on">🏢 단지 순위</button>
      <button data-v="gu">🗺️ 구별 비교</button>
    </div>
    <div class="filters">
      <select id="f-gu"><option value="">서울 전체</option></select>
      <select id="f-sort">
        <optgroup label="상승력">
          <option value="r1">1년 상승률 높은 순</option>
          <option value="r3">3년 상승률 높은 순</option>
        </optgroup>
        <optgroup label="키맞추기">
          <option value="kp">주변보다 싼 순</option>
          <option value="kr">주변보다 덜 오른 순</option>
        </optgroup>
        <optgroup label="국면별 성적">
          <option value="rt">7년 누적 상승률 높은 순 (2019.8→)</option>
          <option value="rgDn">하락기 덜 빠진 순 (2021.8→23.8)</option>
          <option value="rgUp">상승기 많이 오른 순 (2019.8→21.8)</option>
        </optgroup>
        <optgroup label="안정성">
          <option value="df">하락 방어력 높은 순</option>
          <option value="dd">2022 하락기 덜 빠진 순</option>
        </optgroup>
        <optgroup label="수요·유동성">
          <option value="jr">전세가율 높은 순</option>
          <option value="n12">거래 많은 순</option>
          <option value="vt">거래 늘어난 순</option>
        </optgroup>
        <optgroup label="입지">
          <option value="sd">역 가까운 순</option>
          <option value="ct">출근 시간 짧은 순 (선택한 출근지)</option>
          <option value="ac">출근 접근성 높은 순</option>
          <option value="bk">업무지구 가까운 순</option>
          <option value="sE">학군 점수 높은 순 (초중고+학원)</option>
          <option value="em">초등학교 가까운 순</option>
          <option value="a1">학원 많은 순</option>
        </optgroup>
        <optgroup label="단지">
          <option value="hhD">세대수 많은 순</option>
          <option value="far">용적률 낮은 순 (재건축 여력)</option>
        </optgroup>
        <optgroup label="지인">
          <option value="rm">리마크 많은 순</option>
        </optgroup>
        <optgroup label="모델 적정가 (참고용)">
          <option value="gpD">모델보다 비싼 순 (시장 프리미엄)</option>
          <option value="gpA">모델보다 싼 순</option>
        </optgroup>
        <optgroup label="가격">
          <option value="pAsc">평당가 낮은 순</option>
          <option value="pDesc">평당가 높은 순</option>
        </optgroup>
      </select>
      <button id="f-more" class="chip">필터 ▾</button>
      <a class="chip" href="#score" style="text-decoration:none;color:inherit">📊 성적표</a>
    </div>
    <div class="filters more" id="more" hidden>
      <label>84㎡ 예산 <select id="f-budget">
        <option value="">제한 없음</option><option>6</option><option>8</option><option>10</option>
        <option>12</option><option>15</option><option>20</option><option>25</option><option>30</option>
      </select> 억 이하</label>
      <label>세대수 <select id="f-hh">
        <option value="">전체</option><option>300</option><option>500</option><option>1000</option><option>2000</option>
      </select> 이상</label>
      <label>출근지 <select id="f-cw">
        <option value="1">강남</option><option value="0">광화문·종로</option><option value="2">여의도</option>
        <option value="3">판교</option><option value="4">마곡</option><option value="5">성수</option><option value="6">가산·구로</option>
      </select> 까지 <select id="f-cm">
        <option value="">시간 무관</option><option>20</option><option>30</option><option>40</option><option>50</option><option>60</option>
      </select> 분 이내</label>
      <label>역까지 <select id="f-sd">
        <option value="">전체</option><option>300</option><option>500</option><option>1000</option>
      </select> m 이내</label>
      <label>초등학교 <select id="f-es">
        <option value="">전체</option><option value="300">300m 이내 (초품아)</option><option value="500">500m 이내</option>
      </select></label>
      <label>연식 <select id="f-age">
        <option value="">전체</option><option value="10">10년 이내</option><option value="20">20년 이내</option>
        <option value="-30">30년 이상(재건축 후보)</option>
      </select></label>
      <label>성격 <select id="f-ty">
        <option value="">전체</option><option value="전천후형">⭐ 전천후형</option><option value="방어형">🛡️ 방어형</option>
        <option value="탄력형">🚀 탄력형</option><option value="평균형">⚖️ 평균형</option><option value="약세형">⚠️ 약세형</option>
      </select></label>
      <label>하락 방어력 <select id="f-dg">
        <option value="">전체</option><option value="A">A등급만</option><option value="AB">B등급 이상</option>
      </select></label>
      <label>최근 1년 거래 <select id="f-n">
        <option value="">전체</option><option>3</option><option>5</option><option>10</option>
      </select> 건 이상</label>
      <label class="chk"><input type="checkbox" id="f-small"> 소형·정보부족 단지 포함</label>
    </div>
    <div class="count" id="count"></div>
    <ol class="list" id="list"></ol>
  </section>

  <section id="tab-supply" class="tab">
    <div class="seg" id="sub-seg">
      <button data-v="sched" class="on">📅 청약 일정</button>
      <button data-v="cmpet">🔥 경쟁률·가점</button>
      <button data-v="move">🏗️ 입주 예정</button>
    </div>
    <div class="filters" id="sub-filters">
      <select id="s-when">
        <option value="active">진행 중 · 예정</option>
        <option value="6m">최근 6개월</option>
        <option value="all">전체 (2020~)</option>
      </select>
      <select id="s-kind">
        <option value="">일반분양 + 무순위</option>
        <option value="APT">일반분양만</option>
        <option value="무순위">무순위·잔여세대만</option>
      </select>
      <select id="s-sort">
        <option value="date">일정 순</option>
        <option value="mg">예상 차익 큰 순</option>
        <option value="cm">경쟁률 높은 순</option>
        <option value="sc">당첨가점 낮은 순</option>
      </select>
    </div>
    <div id="supply"></div>
  </section>

  <section id="tab-news" class="tab">
    <div class="news-head"><div class="count">📰 부동산 이슈 브리핑 <small>매일 아침 7시 · Claude가 뉴스·정책을 모아 요약</small></div>
      <select id="news-date"></select></div>
    <div id="news"></div>
  </section>

  <section id="tab-fav" class="tab">
    <div class="count">⭐ 관심단지 <small id="fav-note"></small></div>
    <ol class="list" id="fav"></ol>
    <div id="group-favs"></div>
    <div id="feed"></div>
  </section>
</main>

<div class="cmp-bar" id="cmp-bar" hidden></div>

<nav class="tabs">
  <button data-tab="map" class="active"><span>🗺️</span>지도</button>
  <button data-tab="list"><span>📋</span>순위</button>
  <button data-tab="supply"><span>🏠</span>청약</button>
  <button data-tab="news"><span>📰</span>이슈</button>
  <button data-tab="fav"><span>⭐</span>관심</button>
</nav>

<div class="sheet-bg" id="sheet-bg" hidden></div>
<article class="sheet" id="sheet" hidden></article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
